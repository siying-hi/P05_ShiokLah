<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiokLah!</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Open+Sans:wght@300..800&family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="../css/patron/main.css" />
  </head>
  <body>
    <nav class="navrectangle">
      <div class="container">
        <div class="top-nav">
          <div class="nav-left">
            <div class="Logo">
              <img src="../images/ShiokLah(cropped).jpeg" alt="Logo" />
            </div>
          </div>

          <div class="nav-center">
            <ul class="menu" id="menu">
              <li class="menu-item">
                <a href="">Home</a>
                <ul class="dropdown">
                  <li><a href="/patron-homepage">Start Order</a></li>
                </ul>
              </li>

              <li class="menu-item">
                <a href="#">Order History</a>
                <ul class="dropdown">
                  <li><a href="/order-history">Past Orders</a></li>
                  <!-- <button onclick="goToOrderHistory()">Order History</button> -->
                </ul>
              </li>

              <li class="menu-item">
                <a href="#">Profile</a>
                <ul class="dropdown">
                  <li><a href="/patron-profile">Overview</a></li>
                  <li><a href="/analytics">Analytics & Reporting</a></li>
                  <li>
                    <a href="/feedback">Customer Feedback</a>
                  </li>
                  <li><a href="/favourites">Favourites</a></li>
                  <li>
                    <a href="/rewards">Rewards</a>
                  </li>
                </ul>
              </li>

              <li class="menu-item">
                <a id="logoutBtn" href="#">Log Out</a>
              </li>
            </ul>
          </div>

          <div class="nav-right">
            <button class="reserve-btn">Reserve A Table</button>
            <div class="hamburger" id="hamburger">
              <div></div>
              <div></div>
              <div></div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="nav-overlay" id="navOverlay"></div>
    <hr class="Nav-line" />

    <div class="page-content">
      <!-- Banner -->
      <div class="Banner">
        <img
          class="banner-image"
          src="../images/Welcome.jpg"
          alt="Banner Image"
        />
      </div>

      <!-- Welcome Section -->
      <section class="home">
        <div>
          <h2 class="hello-text">
            Hello, <span id="usernameDisplay">Guest</span>
          </h2>
        </div>
        <div class="searchBar">
          <input
            type="text"
            placeholder="What would you like to eat?"
            class="search-input"
          />
          <button class="search-btn">⌕</button>
        </div>
      </section>

      <!-- Cuisines -->
      <section class="cuisines">
        <div class="filter-btn cuisine-card" data-cuisine="Malay">
          <img src="../images/Malay Cuisine Picture.jpg" alt="Malay Cuisine" />
          <p>Malay</p>
        </div>

        <div class="filter-btn cuisine-card" data-cuisine="Chinese">
          <img
            src="../images/Chinese Cuisine Picture.jpg"
            alt="Chinese Cuisine"
          />
          <p>Chinese</p>
        </div>

        <div class="filter-btn cuisine-card" data-cuisine="Indian">
          <img
            src="../images/Indian Cuisine Picture.webp"
            alt="Indian Cuisine"
          />
          <p>Indian</p>
        </div>

        <div class="filter-btn cuisine-card" data-cuisine="Others">
          <img
            src="../images/Other Cuisines Picture.webp"
            alt="Other Cuisine"
          />
          <p>Others</p>
        </div>
      </section>

      <hr class="Content-line" />

      <!-- Stall Grid -->
      <section class="stall-grid" id="stall-grid"></section>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/patron/index.js"></script>
    <script type="module" src="js/patron/patron-homepage.js"></script>
    <script type="module" src="js/utility/logout.js"></script>
  </body>
</html>
