<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiokLah! - Feedback & Support</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/patron/main.css" />
    <link rel="stylesheet" href="/css/patron/feedback.css" />
  </head>
  <body>
    <nav class="navrectangle">
      <div class="container">
        <div class="top-nav">
          <div class="nav-left">
            <div class="Logo">
              <img src="/images/ShiokLah(cropped).jpeg" alt="Logo" />
            </div>
          </div>

          <div class="nav-center">
            <ul class="menu" id="menu">
              <li class="menu-item">
                <a href="#">Home</a>
                <ul class="dropdown">
                  <li><a href="patron-homepage">Start Order</a></li>
                </ul>
              </li>

              <li class="menu-item">
                <a href="#">Order History</a>
                <ul class="dropdown">
                  <li><a href="/order-history">Past Orders</a></li>
                </ul>
              </li>

              <li class="menu-item">
                <a href="#">Profile</a>
                <ul class="dropdown">
                  <li><a href="/patron-profile">Overview</a></li>
                  <li><a href="/analytics">Analytics & Reporting</a></li>
                  <li><a href="/feedback">Customer Feedback</a></li>
                  <li><a href="/favourites">Favourites</a></li>
                  <li>
                    <a href="/rewards">Rewards</a>
                  </li>
                </ul>
              </li>

              <li class="menu-item">
                <a id="logoutBtn" href="/select-role">Log Out</a>
              </li>
            </ul>
          </div>

          <div class="nav-right">
            <button class="reserve-btn">Reserve A Table</button>
            <div class="hamburger" id="hamburger">
              <div></div>
              <div></div>
              <div></div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="nav-overlay" id="navOverlay"></div>
    <hr class="Nav-line" />

    <main class="feedback-page-container">
      <header class="header-group">
        <button class="back-btn" onclick="window.history.back()">←</button>
        <h1 class="main-title">Leave a review</h1>
      </header>

      <div class="section-selector-bar">
        <button class="section-tab-btn active" id="btn-division-fb">
          Customer Feedback
        </button>
        <button class="section-tab-btn" id="btn-division-comp">
          Complaint Department
        </button>
      </div>

      <section id="division-feedback" class="top-level-section active">
        <div class="sub-tabs">
          <button class="sub-tab-btn active" id="tab-submit-fb">
            Submit Feedback
          </button>
          <button class="sub-tab-btn" id="tab-history-fb">
            View Past Feedbacks
          </button>
        </div>

        <div id="pane-fb-submit" class="sub-pane active">
          <form class="clean-form" id="feedbackForm">
            <input type="hidden" id="editFeedbackId" value="" />

            <div class="form-group">
              <label class="form-label" for="fbStallSelect"
                >1. Choose a Food Stall</label
              >
              <select class="underline-input" id="fbStallSelect" required>
                <option value="" disabled selected>
                  Loading your orders...
                </option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Food Quality</label>
              <div class="star-rating" data-category="food">
                <span class="star" data-value="5">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="1">&#9733;</span>
              </div>
              <input type="hidden" id="fbRatingFood" value="0" required />
            </div>

            <div class="form-group">
              <label class="form-label">Service Level</label>
              <div class="star-rating" data-category="service">
                <span class="star" data-value="5">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="1">&#9733;</span>
              </div>
              <input type="hidden" id="fbRatingService" value="0" required />
            </div>

            <div class="form-group">
              <label class="form-label">Atmosphere / Environment</label>
              <div class="star-rating" data-category="atmosphere">
                <span class="star" data-value="5">&#9733;</span>
                <span class="star" data-value="4">&#9733;</span>
                <span class="star" data-value="3">&#9733;</span>
                <span class="star" data-value="2">&#9733;</span>
                <span class="star" data-value="1">&#9733;</span>
              </div>
              <input type="hidden" id="fbRatingAtmosphere" value="0" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="fbComment"
                >Describe your experience in 50 words!</label
              >
              <textarea
                class="box-textarea"
                id="fbComment"
                placeholder="Boon Lay's Banana Leaf Nasi Lemak never disappoints..."
                required
              ></textarea>
            </div>

            <div class="btn-submit-row">
              <button
                type="submit"
                id="fbSubmitButton"
                class="primary-submit-btn"
              >
                Submit review
              </button>
            </div>
          </form>
        </div>

        <div id="pane-fb-history" class="sub-pane">
          <div class="history-cards-grid" id="feedbackHistoryList"></div>
        </div>
      </section>

      <section id="division-complaints" class="top-level-section">
        <div class="sub-tabs">
          <button class="sub-tab-btn active" id="tab-submit-comp">
            Submit Complaint
          </button>
          <button class="sub-tab-btn" id="tab-history-comp">
            View Complaint History
          </button>
        </div>

        <div id="pane-comp-submit" class="sub-pane active">
          <form class="clean-form" id="complaintForm">
            <input type="hidden" id="editComplaintId" value="" />

            <div class="form-group">
              <label class="form-label" for="compStallSelect"
                >1. Which stall did you purchase the food from?</label
              >
              <select class="underline-input" id="compStallSelect" required>
                <option value="" disabled selected>Choose the stall...</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="compDishSelect"
                >2. What dish did you order?</label
              >
              <select
                class="underline-input"
                id="compDishSelect"
                required
                disabled
              >
                <option value="" selected>Select a stall first...</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="compDate"
                >3. Date of purchase</label
              >
              <input
                type="date"
                class="underline-input"
                id="compDate"
                required
                style="max-width: 220px"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="compFoodIssue"
                >4. What aspect of the food were you dissatisfied with?</label
              >
              <textarea
                class="box-textarea"
                id="compFoodIssue"
                required
                placeholder="The food lacked freshness, flavors felt bland or incorrect portion..."
              ></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="compServiceIssue"
                >5. Were you satisfied with the service?</label
              >
              <textarea
                class="box-textarea"
                id="compServiceIssue"
                required
                placeholder="Service response times, staff interactions..."
              ></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="compComments"
                >6. Any other comments?</label
              >
              <textarea
                class="box-textarea"
                id="compComments"
                placeholder="Additional observations..."
              ></textarea>
            </div>

            <div class="btn-submit-row">
              <button
                type="submit"
                id="compSubmitButton"
                class="primary-submit-btn"
              >
                Submit Complaint
              </button>
            </div>
          </form>
        </div>

        <div id="pane-comp-history" class="sub-pane">
          <div class="history-cards-grid" id="complaintHistoryList"></div>
        </div>
      </section>
    </main>

    <script>
      const hamburger = document.getElementById("hamburger");
      const menu = document.getElementById("menu");
      const navOverlay = document.getElementById("navOverlay");
      if (hamburger && menu) {
        hamburger.addEventListener("click", () => {
          menu.classList.toggle("show");
          if (navOverlay) navOverlay.classList.toggle("show");
        });
      }
    </script>

    <script src="/js/patron/feedbacks.js"></script>
    <script src="/js/patron/complaint.js"></script>

    <script>
      const btnDivFb = document.getElementById("btn-division-fb");
      const btnDivComp = document.getElementById("btn-division-comp");
      const divFb = document.getElementById("division-feedback");
      const divComp = document.getElementById("division-complaints");

      btnDivFb.addEventListener("click", () => {
        btnDivFb.classList.add("active");
        btnDivComp.classList.remove("active");
        divFb.classList.add("active");
        divComp.classList.remove("active");
      });

      btnDivComp.addEventListener("click", () => {
        btnDivComp.classList.add("active");
        btnDivFb.classList.remove("active");
        divComp.classList.add("active");
        divFb.classList.remove("active");
      });

      function setupSubTabs(
        submitBtnId,
        historyBtnId,
        submitPaneId,
        historyPaneId,
      ) {
        const submitButton = document.getElementById(submitBtnId);
        const historyButton = document.getElementById(historyBtnId);
        const submitPane = document.getElementById(submitPaneId);
        const historyPane = document.getElementById(historyPaneId);

        submitButton.addEventListener("click", () => {
          submitButton.classList.add("active");
          historyButton.classList.remove("active");
          submitPane.classList.add("active");
          historyPane.classList.remove("active");
        });

        historyButton.addEventListener("click", () => {
          historyButton.classList.add("active");
          submitButton.classList.remove("active");
          historyPane.classList.add("active");
          submitPane.classList.remove("active");
        });
      }

      setupSubTabs(
        "tab-submit-fb",
        "tab-history-fb",
        "pane-fb-submit",
        "pane-fb-history",
      );

      setupSubTabs(
        "tab-submit-comp",
        "tab-history-comp",
        "pane-comp-submit",
        "pane-comp-history",
      );
    </script>
  </body>
</html>
