<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Role</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
        <!-- Shared styles -->
    <link rel="stylesheet" href="css/user/user-pages.css" />
    <!-- Page-specific styles -->
    <link rel="stylesheet" href="css/user/select-role.css" />
  </head>

  <body>
    <div class="container">
      <!-- LEFT IMAGE -->
      <div class="left-pane"></div>

      <!-- RIGHT PANEL -->
      <div class="right-pane">
        <div class="card">
          <img src="/images/ShiokLah(cropped).jpeg" alt="ShiokLah Logo" />

          <button class="roleBtn" data-role="patron">
            Log in as a patron
          </button>

          <button class="roleBtn" data-role="vendor">
            Log in as a stall owner
          </button>

          <button class="roleBtn" data-role="operator">
            Log in as an operator
          </button>

          <button class="roleBtn" data-role="officer">
            Log in as an NEA officer
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/user/select-role.js"></script>
  </body>
</html>
