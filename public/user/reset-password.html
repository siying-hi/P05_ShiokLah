<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/user/user-pages.css" />
    <link rel="stylesheet" href="css/user/reset-password.css"/>
    <title>Reset Password</title>
  </head>
  <body>
    <div class="container">
      <div class="left-pane"></div>

      <div class="right-pane">
        <div class="card">
          <button class="backBtn">←</button>
          <h1>Reset your password</h1>

          <div class="desc">
            Password must be more than 8 digits, mixed of letters and numbers,
            and does not contain special characters.
          </div>
          <div class="message" id="message"></div>
          <div class="inputs">
            <input
              type="password"
              id="newPassword"
              placeholder="New Password"
            />
            <input
              type="password"
              id="confirmPassword2"
              placeholder="Confirm Password"
            />
          </div>

          <button id="resetPasswordBtn">Continue</button>
        </div>
      </div>
    </div>
    <script type="module" src="js/user/reset-password.js"></script>
  </body>
</html>
