<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiokLah! - Reviews</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Open+Sans:wght@300..800&family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- External Styles -->
    <link rel="stylesheet" href="../css/vendor/vendorStyles.css" />
    <link rel="stylesheet" href="../css/vendor/vendorReviews.css" />
  </head>

  <body>
    <div class="container">
      <!-- Vendor Navigation -->
      <div id="vendor-navigation"></div>

      <!-- Page Contents -->
      <main class="contents">
        <!-- Page Header -->
        <header class="page-header">
          <div class="header-row">
            <div class="title-block">
              <h1>Reviews & Complaints</h1>
            </div>

            <!-- Filter -->
            <div class="review-filter">
              <button
                type="button"
                class="filter-btn active"
                data-filter="feedback"
              >
                Feedback
              </button>

              <button type="button" class="filter-btn" data-filter="complaint">
                Complaints
              </button>
            </div>
          </div>
        </header>

        <!-- Feedback / Complaint Content -->
        <section class="reviews-section">
          <!-- Section Summary -->
          <div class="section-heading">
            <div>
              <h2 id="sectionTitle">Customer Feedback</h2>
              <p id="sectionDescription">
                View feedback submitted by customers for your stall.
              </p>
            </div>

            <div class="review-count">
              <span id="reviewCount">0</span>
              <span id="reviewCountLabel">Feedback</span>
            </div>
          </div>

          <!-- Feedback List -->
          <div id="feedbackList" class="review-list">
            <!-- Feedback cards will be generated by JavaScript -->
          </div>

          <!-- Complaint List -->
          <div id="complaintList" class="review-list" style="display: none">
            <!-- Complaint cards will be generated by JavaScript -->
          </div>

          <!-- Empty State -->
          <div id="emptyState" class="empty-state" style="display: none">
            <div class="empty-icon">◎</div>

            <h3 id="emptyTitle">No feedback yet</h3>

            <p id="emptyDescription">
              Customer feedback will appear here once submitted.
            </p>
          </div>
        </section>
      </main>
    </div>

    <!-- Navigation -->
    <script src="/js/vendor/vendorNavigation.js"></script>
    <script src="/js/vendor/loadVendorNavigation.js"></script>

    <!-- Reviews JavaScript -->
    <script type="module" src="/js/vendor/vendorReviews.js"></script>
    <script type="module" src="/js/vendor/vendorReviewsAPI.js"></script>
  </body>
</html>
