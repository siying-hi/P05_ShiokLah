<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiokLah!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Open+Sans:wght@300..800&family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/vendor/vendorStyles.css" />
    <link rel="stylesheet" href="../css/vendor/vendorFoodHandlerCert.css" />
  </head>

  <body>
    <div class="container">
      <div id="vendor-navigation"></div>

      <main class="contents">
        <header class="page-header">
          <div class="header-row">
            <div class="title-block">
              <h1>Food Handler Certificates</h1>
            </div>
            <button id="addBtn" class="create-btn" type="button">+</button>
          </div>
        </header>

        <div class="modal" id="foodCertModal">
          <div class="modal-overlay" id="foodCertOverlay"></div>

          <form class="foodcert-form" id="foodCertForm">
            <h2 id="formTitle">Add Food Handler Certificate</h2>

            <label>Certificate Name</label>
            <input
              type="text"
              id="certificateName"
              placeholder="Enter certificate name"
              required
            />
            <small id="certificateNameError" class="error-message"></small>

            <label>Issue Date</label>
            <input type="date" id="issueDate" required />
            <small id="issueDateError" class="error-message"></small>

            <label>Expiry Date</label>
            <input type="date" id="expiryDate" required />
            <small id="expiryDateError" class="error-message"></small>

            <label>Issuing Authority</label>
            <input
              type="text"
              id="issuingAuthority"
              placeholder="Enter issuing authority"
              required
            />
            <small id="issuingAuthorityError" class="error-message"></small>

            <!-- Added: vendors can upload a certificate picture for NEA review. -->
            <label for="certificatePicture">Certificate Picture</label>
            <input
              type="file"
              id="certificatePicture"
              accept="image/jpeg,image/png,image/webp"
            />
            <small class="certificate-picture-help">
              Add a JPG, PNG, or WEBP picture (maximum 8 MB).
            </small>
            <small id="certificatePictureError" class="error-message"></small>
            <!-- Added: preview the selected certificate before Confirm is pressed. -->
            <div id="certificatePicturePreview" class="certificate-picture-preview" hidden>
              <img id="certificatePicturePreviewImage" alt="Certificate picture preview" />
              <span id="certificatePictureFileName"></span>
            </div>

            <div class="form-buttons">
              <button type="button" class="cancel-btn" id="cancelModal">Cancel</button>
              <button type="submit" class="confirm-btn" id="submitBtn">Confirm</button>
            </div>
            <!-- Added: shows upload, validation, success, or failure feedback. -->
            <p id="certificateSubmitStatus" class="certificate-submit-status" role="status"></p>
          </form>
        </div>

        <section class="certificate">
          <div class="table-header">
            <span>Certificate</span>
            <span>Issue Date</span>
            <span>Expiry Date</span>
            <span>Validity</span>
            <span>Status</span>
            <span>Actions</span>
          </div>
          <div class="certificate-list" id="certificateList"></div>
        </section>
      </main>
    </div>

    <!-- Added: accessible container for approval/rejection popup notifications. -->
    <div
      id="certificateNotificationToasts"
      class="certificate-notification-toasts"
      aria-live="assertive"
      aria-atomic="false"
    ></div>

    <script src="/js/vendor/vendorNavigation.js"></script>
    <script src="/js/vendor/loadVendorNavigation.js"></script>
    <script type="module" src="/js/utility/logout.js"></script>
    <script type="module" src="../js/vendor/foodCert.js"></script>
  </body>
</html>
