<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Operator Dashboard - ShiokLah!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/patron/main.css" />
    <link rel="stylesheet" href="../css/operator/operatorDashboard.css" />
  </head>

  <body>
    <div id="operator-navigation"></div>

    <div class="dash-wrap">
      <!-- Digital Queue Management -->
      <section class="queue-section">
        <h2>Digital Queue Management</h2>
        <table class="queue-table">
          <thead>
            <tr>
              <th>Stall</th>
              <th>Current Queue</th>
              <th>Estimated Wait</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Chicken Rice</td>
              <td>12 customers</td>
              <td>15 mins</td>
            </tr>
            <tr>
              <td>Laksa Delight</td>
              <td>8 customers</td>
              <td>10 mins</td>
            </tr>
            <tr>
              <td>Satay Corner</td>
              <td>5 customers</td>
              <td>7 mins</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Dashboard -->
      <section class="grid">
        <!-- Sales Analytics -->
        <div class="card">
          <div class="card-header">
            <h2>Sales Analytics</h2>
            <div class="chart-filters sales-filters">
              <button class="filter-btn" data-range="month">This Month</button>
              <button class="filter-btn" data-range="3months">Last 3 Months</button>
              <button class="filter-btn" data-range="6months">Last 6 Months</button>
            </div>
          </div>
          <div class="chart-box">
            <canvas id="salesChart"></canvas>
          </div>
        </div>

        <!-- Customer Feedback -->
        <div class="card">
          <div class="card-header">
            <h2>Customer Feedback</h2>
              <div class="chart-filters feedback-filters">
                <button class="filter-btn" data-range="month">This Month</button>
                <button class="filter-btn" data-range="3months">Last 3 Months</button>
                <button class="filter-btn" data-range="6months">Last 6 Months</button>
              </div>
            </div>
          <div class="chart-box chart-box--donut">
            <canvas id="feedbackChart"></canvas>
          </div>
        </div>

        <!-- Hygiene & Inspections -->
        <div class="card full-width">
          <div class="card-header">
            <h2>Hygiene & Inspections</h2>
          </div>
          <table class="hygiene-table">
            <thead>
              <tr>
                <th>Stall</th>
                <th>Grade</th>
                <th>Last Inspection</th>
              </tr>
            </thead>
            <tbody id="hygieneTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../js/operator/loadOperatorNavigation.js"></script>
    <script type="module" src="/js/utility/logout.js"></script>
    <script type="module" src="../js/operator/operatorDashboard.js"></script>
    <script type="module" src="../js/operator/operatorNavigation.js"></script>
  </body>
</html>
